plugins {
    id 'java'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.6.1'
    id "com.github.node-gradle.node" version "7.1.0"
    id("io.freefair.lombok") version "9.8.2"
}


node {
    version = '20.11.0'
    npmVersion = '10.2.4'
    download = true
    workDir = layout.buildDirectory.dir('plugin/ui').get().asFile
    npmWorkDir = layout.buildDirectory.dir('npm').get().asFile
    nodeProjectDir = file("${project.rootDir}/plugin/ui")
}

npm_run_build {
    inputs.files fileTree("ui/src")
    inputs.file 'ui/package.json'
    inputs.file 'ui/package-lock.json'
    outputs.dir 'ui/build'
}

apply from: 'project-properties.gradle'
apply from: scriptsUrl + '/release-fat.gradle'
apply from: scriptsUrl + '/signing.gradle'

repositories {
    mavenLocal()
    mavenCentral { url = "https://repo1.maven.org/maven2" }
    maven { url "https://build.shibboleth.net/nexus/content/repositories/releases/" }
    if (!releaseMode) {
        maven { url = 'https://jitpack.io' }
    }
}

dependencies {
    if (releaseMode) {
        implementation 'com.epam.reportportal:service-api'
        annotationProcessor('com.epam.reportportal:service-api') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    } else {
        implementation 'com.github.reportportal:service-api:d4b2f7c'
        annotationProcessor('com.github.reportportal:service-api:d4b2f7c') {
            exclude group: 'org.springframework.modulith', module: 'spring-modulith-apt'
        }
    }
    implementation 'tools.jackson.core:jackson-databind'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxParallelForks = 1
    testLogging {
        events = ['failed']
        exceptionFormat = 'short'
    }
    reports {
        junitXml.required = true
    }
}

build.dependsOn jacocoTestReport

assemble.dependsOn shadowJar

generatePomFileForShadowPublication { pom.packaging = "jar" }

sourceSets {
    main {
        resources
                {
                    exclude '**'
                }
    }
}

jar {
    from("src/main/resources") {
        into("/resources")
    }
    from("ui/build") {
        into("/resources")
    }
    manifest {
        attributes(
                "Class-Path": configurations.compileClasspath.collect { it.getName() }.join(' '),
                "Plugin-Id": "${pluginId}",
                "Plugin-Version": "${project.version}",
                "Plugin-Provider": "Report Portal",
                "Plugin-Class": "com.epam.reportportal.extension.importing.ImportXUnitPlugin",
                "Plugin-Service": "api"
        )
    }
}

shadowJar {
    from("src/main/resources") {
        into("/resources")
    }
    from("ui/build") {
        into("/resources")
    }
    configurations = [project.configurations.compileClasspath]
    zip64 = true
    dependencies {
        include(dependency('commons-io:commons-io:2.15.1'))
    }
}

def pluginZip = tasks.register('plugin', Jar) {
    archiveBaseName.set("plugin-${pluginId}")
    into('classes') {
        with tasks.named('jar').get()
    }
    into('lib') {
        from configurations.compileClasspath
    }
    archiveExtension.set('zip')
}

tasks.register('assemblePlugin', Copy) {
    from pluginZip
    into pluginsDir
}
